const D=JSON.parse(document.getElementById('data').textContent),T=D.teams;let L='EPL',V='matches',selected=null;
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function dark(c){let a=c.slice(1).match(/../g).map(x=>parseInt(x,16)/255).map(x=>x<=.04045?x/12.92:((x+.055)/1.055)**2.4);return .2126*a[0]+.7152*a[1]+.0722*a[2]<.36}
function colour(id){const t=T[id];return dark(t.primary)?t.primary:dark(t.secondary)?t.secondary:'#314255'}
function badge(id,big=false){const t=T[id],initials=esc(t.name.split(' ').map(x=>x[0]).join('').slice(0,3));return `<a class="logolink ${big?'big':''}" href="#team=${encodeURIComponent(id)}" data-team="${id}" aria-label="${esc(t.name)} 과거 기록 보기" style="--accent:${colour(id)}">${t.logo?`<img class="logoimg" src="${esc(t.logo)}" alt="" width="${big?54:30}" height="${big?60:30}" loading="lazy" referrerpolicy="no-referrer" onerror="this.hidden=true;this.nextElementSibling.hidden=false">`:''}<span class="logofallback" ${t.logo?'hidden':''}>${initials}</span></a>`}
function team(id){return `<span class="mini">${badge(id)}${esc(T[id].name)}</span>`}
function games(id,season=null,before=null){return D.completed.filter(m=>(m.home===id||m.away===id)&&(!season||m.season===season)&&(!before||m.date<before)).sort((a,b)=>a.date.localeCompare(b.date)||a.id.localeCompare(b.id))}
function calc(id,ms){let n=ms.length,p=0,gf=0,ga=0,xg=0,xga=0,w=0,d=0,l=0;ms.forEach(m=>{let h=m.home===id,f=h?m.hg:m.ag,a=h?m.ag:m.hg;p+=f>a?3:f===a?1:0;w+=f>a;d+=f===a;l+=f<a;gf+=f;ga+=a;xg+=h?m.hx:m.ax;xga+=h?m.ax:m.hx});return {n,p,gf,ga,xg,xga,w,d,l}}
function form(id,ms){return `<div class="form" aria-label="최근 경기 결과">${ms.map(m=>{let f=m.home===id?m.hg:m.ag,a=m.home===id?m.ag:m.hg;return `<span title="${m.date}">${f>a?'승':f===a?'무':'패'}</span>`}).join('')}</div>`}
function rows(id,ms){return `<div class="tablewrap"><table><thead><tr><th>상대</th><th>결과</th><th>xG</th></tr></thead><tbody>${ms.slice().reverse().map(m=>{let h=m.home===id;return `<tr><td><a href="${m.source}" target="_blank" rel="noopener">${esc(T[h?m.away:m.home].name)}<br><small class="muted">${m.date}</small></a></td><td>${h?m.hg:m.ag} : ${h?m.ag:m.hg}</td><td>${(h?m.hx:m.ax).toFixed(2)}</td></tr>`}).join('')}</tbody></table></div>`}
function renderMatches(){let fs=D.scheduled.filter(m=>m.league===L&&m.date>='2026-10-06').sort((a,b)=>a.date.localeCompare(b.date)||a.id.localeCompare(b.id)).slice(0,3);if(!fs.length){$('fixtures').textContent='예정 경기 없음';$('comparison').textContent='';$('trend').textContent='';$('recent').textContent='';return}if(!selected||!fs.some(m=>m.id===selected.id))selected=fs[0];$('fixtures').innerHTML=fs.map(m=>`<article class="fixture ${m.id===selected.id?'selected':''}"><div class="fixture-top"><span class="muted">${m.date}</span><button class="openmatch" data-id="${m.id}" aria-pressed="${m.id===selected.id}">분석</button></div><div class="pair">${team(m.home)}<span class="muted">vs</span>${team(m.away)}</div></article>`).join('');$('fixtures').querySelectorAll('button').forEach(b=>b.onclick=()=>{selected=fs.find(m=>m.id===b.dataset.id);renderMatches()});let m=selected,hs=games(m.home,null,m.date).slice(-5),as=games(m.away,null,m.date).slice(-5),h=calc(m.home,hs),a=calc(m.away,as);let c1=colour(m.home),c2=colour(m.away);if(c1===c2)c2=dark(T[m.away].secondary)?T[m.away].secondary:'#586779';
let stats=[['승점',h.p,a.p,0],['경기당 득점',h.n?h.gf/h.n:null,a.n?a.gf/a.n:null,1],['경기당 실점',h.n?h.ga/h.n:null,a.n?a.ga/a.n:null,1],['경기당 기대 득점',h.n?h.xg/h.n:null,a.n?a.xg/a.n:null,2]];
$('comparison').innerHTML=`<div class="matchhead"><div class="club">${badge(m.home,true)}${esc(T[m.home].name)}</div><div class="versus">VS</div><div class="club right">${esc(T[m.away].name)}${badge(m.away,true)}</div></div>${stats.map(([label,x,y,n])=>{let max=Math.max(x||0,y||0,1);return `<div class="stat"><strong>${x===null?'—':x.toFixed(n)}</strong><div><label>${label}</label><div class="bars"><div class="track left"><span class="fill" style="width:${(x||0)/max*100}%;background:${c1}"></span></div><div class="track"><span class="fill" style="width:${(y||0)/max*100}%;background:${c2};border-style:dashed"></span></div></div></div><strong>${y===null?'—':y.toFixed(n)}</strong></div>`}).join('')}<div class="matchhead"><div>${form(m.home,hs)}<span class="muted">${h.n}경기</span></div><span></span><div style="justify-self:end">${form(m.away,as)}<span class="muted">${a.n}경기</span></div></div>`;
let max=Math.max(1,...hs.map(g=>g.home===m.home?g.hx:g.ax),...as.map(g=>g.home===m.away?g.hx:g.ax));max=Math.ceil(max);function line(ms,id,c,dash){let points=ms.map((g,i)=>`${40+i*70},${145-(g.home===id?g.hx:g.ax)/max*115}`).join(' ');return `<polyline points="${points}" fill="none" stroke="${c}" stroke-width="3" ${dash?'stroke-dasharray="7 5"':''}/>`+ms.map((g,i)=>`<circle cx="${40+i*70}" cy="${145-(g.home===id?g.hx:g.ax)/max*115}" r="4" fill="${c}"><title>${esc(T[id].name)} ${g.date} xG ${(g.home===id?g.hx:g.ax).toFixed(2)}</title></circle>`).join('')}
$('trend').innerHTML=`<div class="legend"><span><i style="--c:${c1}"></i>${esc(T[m.home].name)}</span><span><i class="dash" style="--c:${c2}"></i>${esc(T[m.away].name)}</span></div><svg class="chart" viewBox="0 0 360 180" role="img" aria-label="양 팀 최근 리그 경기 기대 득점, 상세 수치는 표에 표시">${[0,max/2,max].map(v=>`<line x1="35" x2="330" y1="${145-v/max*115}" y2="${145-v/max*115}" stroke="#e0e6ee"/><text x="4" y="${150-v/max*115}" fill="#536174" font-size="11">${v.toFixed(1)}</text>`).join('')}${line(hs,m.home,c1,false)}${line(as,m.away,c2,true)}<text x="35" y="171" fill="#536174" font-size="11">이전 경기</text><text x="270" y="171" fill="#536174" font-size="11">최근 경기</text></svg><div class="muted">같은 경기 순서로 비교 · xG: 기회의 득점 기대치</div><details><summary>수치 보기</summary>${rows(m.home,hs)}${rows(m.away,as)}</details>`;$('recent').innerHTML=rows(m.home,hs)}
function renderTeam(){let ts=Object.values(T).filter(t=>t.league===L).sort((a,b)=>a.name.localeCompare(b.name));let old=$('teamselect').value;$('teamselect').innerHTML=ts.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('');if(ts.some(t=>t.id===old))$('teamselect').value=old;else $('teamselect').value=L==='EPL'?'understat:83':'understat:148';updateTeam()}
function historyRows(id,ms){return `<div class="tablewrap"><table><thead><tr><th>날짜 / 상대</th><th>장소</th><th>결과</th><th>xG</th><th>상대 xG</th></tr></thead><tbody>${ms.slice().reverse().map(m=>{let h=m.home===id,opp=h?m.away:m.home,f=h?m.hg:m.ag,a=h?m.ag:m.hg;return `<tr><td>${team(opp)}<small class="muted">${m.date}</small></td><td>${h?'홈':'원정'}</td><td><a href="${m.source}" target="_blank" rel="noopener" aria-label="${m.date} 원본 경기 보기">${f>a?'승':f===a?'무':'패'} ${f} : ${a}</a></td><td>${(h?m.hx:m.ax).toFixed(2)}</td><td>${(h?m.ax:m.hx).toFixed(2)}</td></tr>`}).join('')}</tbody></table></div>`}
function filterHistory(id,ms){let venue=$('venue').value,result=$('resultfilter').value;return ms.filter(m=>{let h=m.home===id,f=h?m.hg:m.ag,a=h?m.ag:m.hg;return (venue==='all'||(venue==='home'?h:!h))&&(result==='all'||(result==='win'?f>a:result==='draw'?f===a:f<a))})}
function updateTeam(){let id=$('teamselect').value,season=$('season').value,ms=games(id,season),s=calc(id,ms),seasons=['2023/24','2024/25','2025/26','2026/27'],summaries=seasons.map(year=>({year,...calc(id,games(id,year))})),filtered=filterHistory(id,ms),home=calc(id,ms.filter(m=>m.home===id)),away=calc(id,ms.filter(m=>m.away===id));let maxRate=Math.max(1,...summaries.filter(v=>v.n).map(v=>v.p/v.n));
$('teamcontent').innerHTML=`<div class="historyname"><div class="club teamheader">${badge(id,true)}<div><h2>${esc(T[id].name)}</h2><span class="muted">${L==='EPL'?'프리미어리그':'라리가'} · ${season}</span></div></div><span class="status">리그 기록</span></div>${s.n?`<div class="summary"><div><strong>${s.n}</strong><label>경기</label></div><div><strong>${s.p}</strong><label>승점</label></div><div><strong>${s.w} / ${s.d} / ${s.l}</strong><label>승 / 무 / 패</label></div><div><strong>${s.gf} : ${s.ga}</strong><label>득점 / 실점</label></div></div><div class="splitstats">${[['홈',home],['원정',away]].map(([label,v])=>`<div><h3>${label} · ${v.n}경기</h3><strong>${v.w}승 ${v.d}무 ${v.l}패</strong><span class="muted">경기당 승점 ${v.n?(v.p/v.n).toFixed(2):'—'} · xG ${v.n?(v.xg/v.n).toFixed(2):'—'}</span></div>`).join('')}</div>`:'<p class="muted">선택한 시즌의 리그 자료가 없습니다.</p>'}<div class="timeline-title"><h3>시즌별 기록</h3><span class="muted">경기당 승점</span></div><div class="seasontrend" role="img" aria-label="시즌별 경기당 승점, 상세 수치는 아래 표에 표시">${summaries.map(v=>`<div class="seasoncolumn"><small>${v.n?(v.p/v.n).toFixed(2):'—'}</small><div class="stick" style="--height:${v.n?(v.p/v.n)/maxRate*90:2}px;--colour:${colour(id)}"></div><small>${v.year}</small></div>`).join('')}</div><div class="tablewrap"><table><thead><tr><th>시즌</th><th>경기</th><th>승·무·패</th><th>득실점</th><th>승점</th><th>경기당 xG</th></tr></thead><tbody>${summaries.map(v=>`<tr class="${v.year===season?'selectedseason':''}"><td><button class="seasonbutton" data-season="${v.year}" aria-label="${v.year} 경기 기록 보기">${v.year}</button></td><td>${v.n||'—'}</td><td>${v.n?`${v.w}·${v.d}·${v.l}`:'—'}</td><td>${v.n?`${v.gf}:${v.ga}`:'—'}</td><td>${v.n?v.p:'—'}</td><td>${v.n?(v.xg/v.n).toFixed(2):'—'}</td></tr>`).join('')}</tbody></table></div><p class="note">2026/27은 진행 중 · 자료 없는 시즌은 — 표시</p><div class="timeline-title"><h3>경기 기록</h3><span class="muted">${filtered.length} / ${ms.length}경기</span></div>${filtered.length?historyRows(id,filtered):'<p class="muted">선택 조건의 경기가 없습니다.</p>'}`;
$('teamcontent').querySelectorAll('[data-season]').forEach(b=>b.onclick=()=>{$('season').value=b.dataset.season;$('venue').value='all';$('resultfilter').value='all';updateTeam()})}
function openTeam(id){if(!T[id])return;L=T[id].league;V='team';$('league').value=L;$('venue').value='all';$('resultfilter').value='all';render();$('teamselect').value=id;updateTeam()}
function renderLeague(){let map={};D.completed.filter(m=>m.league===L&&m.season==='2026/27').forEach(m=>[m.home,m.away].forEach(id=>{map[id]=true}));let ss=Object.keys(map).map(id=>({id,...calc(id,games(id,'2026/27'))})).sort((a,b)=>b.p-a.p||(b.gf-b.ga)-(a.gf-a.ga)||T[a.id].name.localeCompare(T[b.id].name));$('standings').innerHTML=`<table><thead><tr><th>팀</th><th>경기</th><th>승</th><th>무</th><th>패</th><th>득실</th><th>승점</th></tr></thead><tbody>${ss.map(s=>`<tr><td>${team(s.id)}</td><td>${s.n}</td><td>${s.w}</td><td>${s.d}</td><td>${s.l}</td><td>${s.gf-s.ga}</td><td><strong>${s.p}</strong></td></tr>`).join('')}</tbody></table><p class="note">경기 결과 집계 · 징계에 따른 승점 조정 미반영</p>`}
function render(){['matches','team','leagueview'].forEach(id=>$(id).hidden=id!==({matches:'matches',team:'team',league:'leagueview'}[V]));$('heading').textContent={matches:'다가오는 경기',team:'팀 분석',league:'리그 현황'}[V];document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===V));if(V==='matches')renderMatches();if(V==='team')renderTeam();if(V==='league')renderLeague()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{V=b.dataset.view;render()});$('league').onchange=()=>{L=$('league').value;selected=null;render()};$('teamselect').onchange=()=>{$('venue').value='all';$('resultfilter').value='all';updateTeam()};$('season').onchange=updateTeam;$('venue').onchange=updateTeam;$('resultfilter').onchange=updateTeam;$('lastdate').textContent=D.last_date;render();

document.addEventListener('click',event=>{const link=event.target.closest('[data-team]');if(!link)return;event.preventDefault();openTeam(link.dataset.team);const hash='#team='+encodeURIComponent(link.dataset.team);if(window.location.hash!==hash)window.location.hash=hash});
function readTeamHash(){if(!window.location.hash.startsWith('#team='))return;try{openTeam(decodeURIComponent(window.location.hash.slice(6)))}catch(error){}}
window.addEventListener('hashchange',readTeamHash);readTeamHash();
</script></body></html>
